<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Сайт завершил работу</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:#07080a;color:#e8eaee;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;min-height:100vh;padding:30px;-webkit-user-select:none;user-select:none;overflow:hidden}
.box{max-width:480px}
.half{font-size:52px;display:block;margin-bottom:20px}
h1{font-size:28px;font-weight:800;margin:0 0 12px;color:#fff;line-height:1.3}
p{color:#9aa3b0;font-size:15px;margin:0}
.bar{margin-top:26px;width:70px;height:3px;background:#2c313a;border-radius:2px;margin-left:auto;margin-right:auto}
</style>
</head>
<body>
<div class="box">
  <span class="half">🛑</span>
  <h1>Сайт больше не принадлежит для работы.</h1>
  <p>Работоспособность сайта прекращена по решению владельца.</p>
  <div class="bar"></div>
</div>
</body>
</html>
